<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students | Classroom</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: navigation('Students')}"></div>
  <main class="page-content">
    <section class="page-heading"><div><p class="eyebrow">SCHOOL DIRECTORY</p><h1>Students</h1><p class="muted">Manage student details and review individual attendance history.</p></div><span class="count-pill" th:text="|${#lists.size(students)} students|">0 students</span></section>
    <div class="notice notice-success" th:if="${success}" th:text="${success}" role="status"></div>
    <div class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></div>
    <section class="panel">
      <div class="panel-title"><div><p class="eyebrow">STUDENT ROSTER</p><h2>Add a student</h2></div></div>
      <form class="add-form" th:action="@{/students}" method="post">
        <label>Student name<input name="name" maxlength="100" placeholder="e.g. Maya Chen" required></label>
        <label>Student ID<input name="studentNumber" maxlength="30" placeholder="e.g. STU-1042" required></label>
        <label>Class<select name="classId" required><option value="" disabled selected>Select a class</option><option th:each="schoolClass : ${classes}" th:value="${schoolClass.id}" th:text="${schoolClass.name}">Grade 8A</option></select></label>
        <button class="button button-primary" type="submit">+ Add student</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>STUDENT</th><th>STUDENT ID</th><th>CLASS</th><th>ATTENDANCE</th><th>ACTION</th></tr></thead>
          <tbody>
            <tr th:each="student : ${students}">
              <td><span class="student-name" th:text="${student.name}">Student Name</span></td>
              <td th:text="${student.studentNumber}">STU-1001</td>
              <td th:text="${student.schoolClass.name}">Grade 8A</td>
              <td><a class="text-link" th:href="@{/students/{id}/history(id=${student.id})}">View history</a></td>
              <td><form th:action="@{/students/{id}/delete(id=${student.id})}" method="post" onsubmit="return confirm('Remove this student and their attendance records?')"><button class="text-button text-danger" type="submit">Remove</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(students)}"><td colspan="5" class="empty-cell">No students yet. Add your first student above.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <footer>Student IDs must be unique.</footer>
  </main>
</div>
</body>
</html>
