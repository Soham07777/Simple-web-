<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Classroom</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand login-brand" th:href="@{/}"><span class="brand-mark">C</span> Classroom</a>
    <p class="eyebrow">STUDENT ATTENDANCE MANAGEMENT</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your students and class attendance.</p>
    <div class="notice notice-error" th:if="${param.error}">Incorrect username or password.</div>
    <div class="notice notice-success" th:if="${param.logout}">You have signed out.</div>
    <form th:action="@{/login}" method="post" class="stack-form">
      <label>Username<input type="text" name="username" autocomplete="username" required autofocus></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="button button-primary full-button" type="submit">Sign in</button>
    </form>
    <p class="login-footnote">Local demo account: <strong>admin</strong> / <strong>Admin123!</strong></p>
  </main>
</body>
</html>
