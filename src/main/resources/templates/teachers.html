<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teachers | Classroom</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments :: navigation('Teachers')}"></div>
  <main class="page-content">
    <section class="page-heading"><div><p class="eyebrow">SCHOOL DIRECTORY</p><h1>Teachers</h1><p class="muted">Keep your school's staff directory up to date.</p></div><span class="count-pill" th:text="|${#lists.size(teachers)} teachers|">0 teachers</span></section>
    <div class="notice notice-success" th:if="${success}" th:text="${success}" role="status"></div>
    <div class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></div>
    <section class="panel">
      <div class="panel-title"><div><p class="eyebrow">STAFF DIRECTORY</p><h2>Add a teacher</h2></div></div>
      <form class="add-form teacher-form" th:action="@{/teachers}" method="post">
        <label>Teacher name<input name="name" maxlength="100" placeholder="e.g. Taylor Morgan" required></label>
        <label>Employee ID<input name="employeeNumber" maxlength="30" placeholder="e.g. TCH-001" required></label>
        <label>Email<input name="email" type="email" maxlength="120" placeholder="teacher@school.edu" required></label>
        <label>Subject<input name="subject" maxlength="80" placeholder="e.g. Mathematics" required></label>
        <button class="button button-primary" type="submit">+ Add teacher</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>TEACHER</th><th>EMPLOYEE ID</th><th>EMAIL</th><th>SUBJECT</th><th>ACTION</th></tr></thead>
          <tbody>
            <tr th:each="teacher : ${teachers}">
              <td><span class="student-name" th:text="${teacher.name}">Teacher Name</span></td>
              <td th:text="${teacher.employeeNumber}">TCH-001</td>
              <td th:text="${teacher.email}">teacher@school.edu</td>
              <td th:text="${teacher.subject}">Mathematics</td>
              <td><form th:action="@{/teachers/{id}/delete(id=${teacher.id})}" method="post" onsubmit="return confirm('Remove this teacher?')"><button class="text-button text-danger" type="submit">Remove</button></form></td>
            </tr>
            <tr th:if="${#lists.isEmpty(teachers)}"><td colspan="5" class="empty-cell">No teachers have been added yet.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>
</body>
</html>
